<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raiderbro Requirement Tracker</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="hero-brand">
        <span class="tool-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M9 6h11"></path>
            <path d="M9 12h11"></path>
            <path d="M9 18h11"></path>
            <path d="M4 6.5l1.8 1.8L8.8 5"></path>
            <path d="M4 12.5l1.8 1.8 3-3.3"></path>
            <path d="M4 18.5l1.8 1.8 3-3.3"></path>
          </svg>
        </span>
        <h1>Requirement Tracker</h1>
      </div>
      <div class="hero-actions">
        <button id="include-future-needs" class="future-toggle-button" type="button" aria-pressed="false">Include Future</button>
        <div class="hero-metrics">
          <div class="mini-stat">
            <p class="label">Cards Maxed</p>
            <p id="maxed-count" class="mini-number">0 / 0</p>
          </div>
        </div>
        <button id="reset-progress" class="secondary" type="button">Reset Wipe Progress</button>
      </div>
    </header>

    <section class="shopping-panel">
      <div class="shopping-header">
        <div>
          <p id="shopping-summary-label" class="label">Need Right Now</p>
          <h2 class="shopping-title">Global Shopping List</h2>
        </div>
        <div class="shopping-controls">
          <div class="shopping-toggle" role="tablist" aria-label="Shopping list grouping">
            <button id="group-by-card" class="toggle-button active" type="button">By Card</button>
            <button id="group-by-found" class="toggle-button" type="button">By Found In</button>
          </div>
        </div>
      </div>
      <div id="shopping-list" class="shopping-board"></div>
    </section>

    <section class="card-filter-bar">
      <p class="label">Visible Cards</p>
      <div class="card-scope-toggle" role="tablist" aria-label="Tracker card scope">
        <button id="scope-all" class="toggle-button active" type="button">All</button>
        <button id="scope-workshops" class="toggle-button" type="button">Workshops</button>
        <button id="scope-scrappy" class="toggle-button" type="button">Scrappy</button>
        <button id="scope-expedition" class="toggle-button" type="button">Expedition</button>
        <button id="scope-projects" class="toggle-button" type="button">Projects</button>
      </div>
    </section>

    <section>
      <div id="cards-grid" class="cards-grid"></div>
    </section>

    <footer class="tracker-footer">
      <p id="tracker-build-info" class="footer-note">Data build unavailable.</p>
      <div class="footer-actions">
        <button id="export-progress" class="secondary footer-button" type="button">Export Progress</button>
        <button id="import-progress" class="secondary footer-button" type="button">Import Progress</button>
        <input id="import-progress-file" type="file" accept=".json,application/json" hidden>
      </div>
    </footer>
  </div>

  <script src="../../generated/item_data.js"></script>
  <script src="../../generated/weapon_data.js"></script>
  <script src="../../generated/requirement_tracker_data.js"></script>
  <script src="src/tracker-state.js"></script>
  <script src="src/tracker-tooltip.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
